# ============================================================================
# PM Web 管理后台 Nginx 反向代理（Cloudflare 回源版，仅 80 端口）
#   pm.kbtoken.top  →  本机 PM (127.0.0.1:19090)
#
# TLS 由 Cloudflare 终结（DNS 已走 CF 橙云代理）。链路：
#   浏览器 ──HTTPS──▶ Cloudflare ──HTTP:80──▶ 本 nginx ──▶ PM(127.0.0.1:19090)
# 因此本配置不开 443、不配证书、不做 80→443 跳转（HTTPS 在 CF 侧开启）。
#
# 若 PM 监听地址改过（非 127.0.0.1:19090），同步修改两处 proxy_pass。
# 若 nginx.conf 的 http 块已全局配置过 Cloudflare real_ip，删除下方整段
# set_real_ip_from/real_ip_header 即可，避免重复。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name pm.kbtoken.top;

    # ---- Cloudflare：从 CF 头还原真实访客 IP ----
    # 否则 access_log / $remote_addr 看到的全是 CF 回源 IP，无法审计真实来源。
    # 段列表来源 https://www.cloudflare.com/ips/ ，CF 偶有增补，定期更新。
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/pm.kbtoken.top.access.log;
    error_log  /var/log/nginx/pm.kbtoken.top.error.log;

    # 静态资源压缩（不含 text/event-stream —— SSE 不可压缩）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml;

    # PUT /api/v1/config 上传配置时放开（CF 免费版回源 body 上限约 100MB）
    client_max_body_size 10m;

    # ---- 可选加固 ----
    # 只允许 Cloudflare 回源，阻止攻击者直连 23.251.34.152:80 绕过 CF。
    # 取消注释即可（段与上面 set_real_ip_from 一致；CF 更新 IP 段需同步，否则站点会被误拦）：
    #
    # allow 173.245.48.0/20;
    # allow 103.21.244.0/22;
    # allow 103.22.200.0/22;
    # allow 103.31.4.0/22;
    # allow 141.101.64.0/18;
    # allow 108.162.192.0/18;
    # allow 190.93.240.0/20;
    # allow 188.114.96.0/20;
    # allow 197.234.240.0/22;
    # allow 198.41.128.0/17;
    # allow 162.158.0.0/15;
    # allow 104.16.0.0/13;
    # allow 104.24.0.0/14;
    # allow 172.64.0.0/13;
    # allow 131.0.72.0/22;
    # deny  all;

    # ---- SSE 日志流：/api/v1/logs/{name}/stream ----
    # 必须关闭缓冲并延长超时，否则实时日志会被 nginx 攒批下发，前端看不到流。
    # CF 侧对 EventSource 默认支持；若日志暂停超 100s，CF 免费版可能断连，
    # 让 PM 端持续推送心跳或前端自动重连即可。
    location ~ ^/api/v1/logs/.+/stream$ {
        proxy_pass http://127.0.0.1:19090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering no always;
    }

    # ---- 其余请求：全部反代到 PM ----
    location / {
        proxy_pass http://127.0.0.1:19090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
