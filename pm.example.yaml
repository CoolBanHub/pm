# PM 守护进程配置文件（YAML）。
# 所有相对路径均以本文件所在目录为基准。
# 安装后默认配置位于 ~/.pm/pm.yaml，首次启动守护进程时自动生成。

# CLI 控制 Socket 路径。
socket: pm.sock
# 事件历史、暂停/禁用标记等运行状态目录；"." 表示配置文件所在目录。
state_dir: .
# 内存中保留的事件数量；0 为关闭。
event_history: 1000

web:
  # 不需要 HTTP 管理后台时设为 false；Unix Socket CLI 不受影响。
  enabled: true
  listen: 127.0.0.1:19090
  # 访问令牌。仅本机回环监听时可留空；超出回环必须配置 token 或 token_env。
  token: ""
  # 读取访问令牌的环境变量名（推荐，避免明文写入配置）。
  token_env: ""

# 受管进程列表。每个条目省略的字段会使用默认值，见 README 字段表。
programs:
  - name: example-worker
    group: workers
    command: /bin/sh
    # command 不经过 shell；需要管道/重定向/循环时显式调用 sh -c。
    args: ["-c", 'while true; do echo "tick $(date)"; sleep 5; done']
    directory: "."
    environment:
      APP_ENV: local
    autostart: true
    # 重启策略：never | unexpected | always
    restart: unexpected
    restart_delay: 1s
    max_restarts: 5
    restart_window: 1m
    # 停止信号：TERM | INT | QUIT | HUP
    stop_signal: TERM
    stop_timeout: 10s
    stdout_log: logs/example-worker.log
    stderr_log: logs/example-worker.error.log
    # Go 程序启用 net/http/pprof 后可配置，用于采集 goroutine 数。
    # pprof_url: http://127.0.0.1:6060/debug/pprof
    # 单个日志文件切割阈值；0 为不切割。
    log_max_bytes: 10485760
    # 保留的轮转日志数量。
    log_backups: 3
